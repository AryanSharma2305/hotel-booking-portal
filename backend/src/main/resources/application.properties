spring.application.name=hotel-booking-backend
server.port=8080

# Credentials are NOT stored here. They are read from environment variables,
# or from a local backend/.env file (git-ignored). See .env.example.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hotel_booking}?serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Schema and sample data come from Flyway scripts in src/main/resources/db/migration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# How many days ahead guests can book (room inventory is kept for this window)
booking.window-days=365
booking.max-nights=30
